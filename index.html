<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox1ipa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin: 20px 0;
        }
        header h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }
        /* الأقسام بجانب بعضها أفقيًا */
        .tabs-nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .tab-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
        }
        .section {
            display: none;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }
        .section.active {
            display: block;
        }
        .section h2 {
            font-size: 1.3rem;
            color: #38bdf8;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .item-card {
            background-color: #0f172a;
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .item-name {
            font-size: 1rem;
            color: #f8fafc;
            font-weight: 500;
            text-align: right;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.2s;
            text-align: center;
        }
        .btn:hover {
            background-color: #0284c7;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            border-top: 1px solid #334155;
        }
        .telegram-btn {
            display: inline-block;
            background-color: #229ed9;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(34, 158, 217, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>Fox1ipa</h1>
        <p>متجر تطبيقات وأدوات آبل</p>
    </header>

    <div class="container">
        
        <!-- أزرار الأقسام بجانب بعضها -->
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab(event, 'apps')">📱 التطبيقات</button>
            <button class="tab-btn" onclick="switchTab(event, 'signing')">✍️ برامج التوقيع</button>
            <button class="tab-btn" onclick="switchTab(event, 'certs')">🛡️ الشهادات</button>
        </div>

        <!-- القسم الأول: التطبيقات -->
        <div id="apps" class="section active">
            <h2>📱 التطبيقات</h2>
            <div class="items-list">
                <div class="item-card">
                    <span class="item-name">تطبيق تجريبي 1 <br><small style="color:#94a3b8;">(ipa.)</small></span>
                    <a href="#" class="btn">تحميل</a>
                </div>
                <div class="item-card">
                    <span class="item-name">تطبيق تجريبي 2 <br><small style="color:#94a3b8;">(ipa.)</small></span>
                    <a href="#" class="btn">تحميل</a>
                </div>
            </div>
        </div>

        <!-- القسم الثاني: برامج التوقيع -->
        <div id="signing" class="section">
            <h2>✍️ برامج التوقيع</h2>
            <div class="items-list">
                <div class="item-card">
                    <span class="item-name">برنامج Esign</span>
                    <a href="#" class="btn">تحميل</a>
                </div>
                <div class="item-card">
                    <span class="item-name">برنامج GBox</span>
                    <a href="#" class="btn">تحميل</a>
                </div>
            </div>
        </div>

        <!-- القسم الثالث: شهادات أبل -->
        <div id="certs" class="section">
            <h2>🛡️ شهادات أبل</h2>
            <div class="items-list">
                <div class="item-card">
                    <span class="item-name">الشهادة الحالية <br><small style="color:#22c55e;">(متاحة)</small></span>
                    <a href="#" class="btn" style="background-color: #10b981;">تثبيت الشهادة</a>
                </div>
            </div>
        </div>

    </div>

    <!-- قناة التلغرام وحدها في الأسفل تماماً -->
    <footer>
        <p style="margin-bottom: 15px; color: #94a3b8;">للانضمام إلى قناتنا ومتابعة كل جديد:</p>
        <a href="https://t.me/ipastrong" target="_blank" class="telegram-btn">انضم لقناة التلغرام 🚀</a>
    </footer>

    <script>
        function switchTab(evt, tabName) {
            let sections = document.getElementsByClassName("section");
            for (let i = 0; i < sections.length; i++) {
                sections[i].classList.remove("active");
            }
            let buttons = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>

</body>
</html>
